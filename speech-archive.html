<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>명연설 & 명언 아카이브</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      padding: 32px 16px;
    }
    header {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 28px auto;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    header p {
      color: #aaa;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .download-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }
    .btn-download {
      background: #238636;
      color: #fff;
      border: 1px solid #2ea043;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }
    .btn-download:hover {
      background: #2ea043;
    }

    .controls {
      max-width: 1000px;
      margin: 0 auto 32px auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .search-input {
      width: 100%;
      max-width: 520px;
      padding: 12px 20px;
      border-radius: 24px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .search-input:focus {
      border-color: #3ea6ff;
    }
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .filter-btn {
      background: #212121;
      color: #aaa;
      border: 1px solid #333;
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      background: #303030;
      color: #fff;
    }
    .filter-btn.active {
      background: #3ea6ff;
      color: #000;
      font-weight: 600;
      border-color: #3ea6ff;
    }
    .counter {
      color: #777;
      font-size: 0.85rem;
      margin-top: -6px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .video-card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border: 1px solid #272727;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7);
      border-color: #3ea6ff;
    }
    .thumb-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #252525;
    }
    .thumb-box img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .play-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(204, 0, 0, 0.92);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .info-box {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .badge {
      align-self: flex-start;
      font-size: 0.75rem;
      background: #2a2a2a;
      color: #3ea6ff;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .info-box h3 {
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 8px;
      color: #f1f1f1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .speaker {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: auto;
    }
    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: #666;
      font-size: 1.1rem;
    }

    .section-tabs { display:flex; justify-content:center; gap:10px; margin: 0 auto 24px; }
    .section-btn { background:#1a1a1a; color:#bbb; border:1px solid #333; padding:10px 22px; border-radius:24px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all .2s ease; }
    .section-btn:hover { color:#fff; background:#262626; }
    .section-btn.active { background:#f1f1f1; color:#0f0f0f; border-color:#f1f1f1; }
    .quote-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; max-width:1440px; margin:0 auto; }
    .quote-card { background:#181818; border:1px solid #272727; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:14px; transition:border-color .2s ease, transform .2s ease; }
    .quote-card:hover { border-color:#3ea6ff; transform:translateY(-3px); }
    .quote-ko { font-size:1rem; line-height:1.65; color:#f1f1f1; margin-bottom:8px; }
    .quote-ko::before { content:"\201C"; color:#3ea6ff; font-size:1.6rem; line-height:0; vertical-align:-0.35em; margin-right:4px; }
    .quote-en { font-size:0.9rem; line-height:1.55; color:#aaa; font-style:italic; margin-bottom:8px; }
    .quote-foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .quote-author { font-size:0.85rem; color:#aaa; }
    .copy-btn { white-space:nowrap; flex-shrink:0; background:transparent; border:1px solid #333; color:#999; border-radius:14px; padding:4px 10px; font-size:0.75rem; cursor:pointer; }
    .copy-btn:hover { color:#fff; border-color:#666; }
    .random-box { max-width:760px; margin:0 auto 28px; text-align:center; background:linear-gradient(135deg,#1b2a3a,#181818); border:1px solid #2c3e50; border-radius:14px; padding:24px 20px; }
    .random-box .quote-ko { font-size:1.15rem; margin-bottom:10px; }
    .random-box .quote-en { font-size:0.95rem; margin-bottom:12px; }
    .random-btn { margin-top:14px; background:#3ea6ff; color:#000; border:none; padding:8px 18px; border-radius:18px; font-weight:600; cursor:pointer; }
    .hidden { display:none !important; }
    .author-link { background:none; border:none; padding:0; font:inherit; font-size:0.85rem; color:#3ea6ff; cursor:pointer; text-align:left; border-bottom:1px dashed rgba(62,166,255,.5); }
    .author-link:hover { color:#7cc4ff; border-bottom-color:#7cc4ff; }
    .author-plain { font-size:0.85rem; color:#888; }
    .random-box .author-link { font-size:0.95rem; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:1000; animation:fadeIn .15s ease; }
    .modal { position:relative; width:100%; max-width:440px; max-height:calc(100vh - 32px); overflow-y:auto; background:#1a1a1a; border:1px solid #333; border-radius:16px; padding:28px 24px 22px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6); animation:popIn .18s ease; }
    .modal-close { position:absolute; top:10px; right:12px; background:none; border:none; color:#888; font-size:1.5rem; line-height:1; cursor:pointer; padding:4px 8px; }
    .modal-close:hover { color:#fff; }
    .person-photo { width:120px; height:120px; margin:0 auto 14px; border-radius:50%; overflow:hidden; background:#2a2a2a; border:2px solid #3ea6ff; display:flex; align-items:center; justify-content:center; font-size:2.6rem; font-weight:700; color:#3ea6ff; }
    .person-photo img { width:100%; height:100%; object-fit:cover; object-position:center 20%; }
    .person-name { font-size:1.35rem; font-weight:700; color:#fff; }
    .person-en { font-size:0.9rem; color:#999; margin-top:2px; }
    .person-intro { font-size:0.93rem; line-height:1.65; color:#ddd; margin:16px 0 14px; text-align:left; }
    .person-quotes { text-align:left; background:#141414; border:1px solid #2a2a2a; border-radius:10px; padding:12px 14px; margin-bottom:18px; }
    .person-quotes h4 { font-size:0.78rem; color:#888; font-weight:600; margin-bottom:8px; }
    .person-quotes li { list-style:none; font-size:0.86rem; line-height:1.55; color:#ccc; padding:6px 0; border-top:1px solid #242424; }
    .person-quotes li:first-of-type { border-top:none; padding-top:0; }
    .person-quotes li span { display:block; color:#888; font-style:italic; font-size:0.8rem; margin-top:2px; }
    .modal-actions { display:flex; flex-direction:column; gap:8px; }
    .modal-btn { display:block; text-decoration:none; padding:10px 14px; border-radius:22px; font-size:0.9rem; font-weight:600; }
    .modal-btn.primary { background:#3ea6ff; color:#000; }
    .modal-btn.primary:hover { background:#65b8ff; }
    .modal-btn.secondary { border:1px solid #444; color:#ccc; }
    .modal-btn.secondary:hover { border-color:#888; color:#fff; }
    .modal-credit { font-size:0.7rem; color:#666; margin-top:12px; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes popIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
    .speaker-wrap { width:100%; max-width:1000px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .speaker-label { font-size:0.8rem; color:#888; }
    .speaker-tabs { overflow:hidden; transition:max-height .25s ease; }
    .speaker-tabs .filter-btn { font-size:0.78rem; padding:6px 12px; }
    .speaker-toggle { background:transparent; border:1px solid #333; color:#3ea6ff; border-radius:16px; padding:5px 16px; font-size:0.8rem; cursor:pointer; }
    .speaker-toggle:hover { border-color:#3ea6ff; }
    .copy-btn.done { color:#2ea043; border-color:#2ea043; }
    @media (max-width:600px){ header h1{font-size:1.5rem;} .quote-grid,.video-grid{grid-template-columns:1fr;} }
    .back-row { display: flex; flex-wrap: wrap; gap: 16px; max-width: 860px; margin: 0 auto 20px auto; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; color: #999; text-decoration: none; }
    .back-link:hover { color: #3ea6ff; }
  </style>
</head>

  <section id="videoSection">

      <div class="filter-tabs" id="filterTabs"></div>
      <div class="speaker-wrap">
        <div class="speaker-label">🎤 명사별 보기</div>
        <div class="filter-tabs speaker-tabs collapsed" id="speakerTabs"></div>

      </div>
      <div class="counter" id="counterText"></div>
    </div>
    <main class="video-grid" id="videoGrid"></main>
  </section>

  <section id="quoteSection" class="hidden">
    <div class="random-box">
      <div class="quote-ko" id="randomText"></div>
      <div class="quote-en" id="randomEnText"></div>
      <div class="quote-author" id="randomAuthor"></div>
      <button class="random-btn" id="randomBtn">🎲 오늘의 명언 다시 뽑기</button>
    </div>
    <div class="controls">
      <input type="text" id="quoteSearch" class="search-input" placeholder="명언 또는 인물 검색...">
      <div class="filter-tabs" id="quoteTabs"></div>
      <div class="counter" id="quoteCounter"></div>
    </div>
    <main class="quote-grid" id="quoteGrid"></main>
  </section>

  <div class="modal-overlay hidden" id="personModal" role="dialog" aria-modal="true" aria-labelledby="personName">
    <div class="modal">

      <div class="person-photo" id="personPhoto"></div>

      <div class="person-quotes" id="personQuotes"></div>
      <div class="modal-actions" id="personLinks"></div>
      <div class="modal-credit" id="personCredit"></div>

        { ko: "인생은 과감한 모험이거나, 아무것도 아니다.", en: "Life is either a daring adventure or nothing.", author: "헬렌 켈러" },
        { ko: "수많은 패배를 겪을 수는 있지만, 결코 패배해서는 안 된다.", en: "You may encounter many defeats, but you must not be defeated.", author: "마야 안젤루" },
        { ko: "죽고자 하면 살고, 살고자 하면 죽는다. (必死則生 必生則死)", en: "Those who seek death shall live; those who seek life shall die.", author: "이순신" }
      ],
      grit: [

        { ko: "노력은 두 번 계산된다.", en: "Effort counts twice.", author: "앤절라 더크워스" },
        { ko: "천재는 1%의 영감과 99%의 노력이다.", en: "Genius is 1% inspiration and 99% perspiration.", author: "토머스 에디슨" },
        { ko: "나는 1만 가지 방법을 찾았을 뿐 실패하지 않았다.", en: "I've just found 10,000 ways that won't work.", author: "토머스 에디슨" },
        { ko: "포기하는 자는 이기지 못하고 이기는 자는 포기하지 않는다.", en: "Quitters never win and winners never quit.", author: "빈스 롬바디" },
        { ko: "맘바 멘탈리티는 매일 어제보다 나아지는 것이다.", en: "The Mamba Mentality is all about hard work and commitment to excellence.", author: "코비 브라이언트" },
        { ko: "압박과 도전 같은 부정적인 것들은 모두 내가 도약할 기회다.", en: "Everything negative – pressure, challenges – is all an opportunity for me to rise.", author: "코비 브라이언트" },
        { ko: "고통은 일시적이지만 포기는 영원하다.", en: "Pain is temporary but quitting lasts forever.", author: "랜스 암스트롱" },
        { ko: "챔피언은 체육관이 아니라 내면의 갈망에서 만들어진다.", en: "Champions are made from something they have deep inside—a desire, a dream.", author: "무하마드 알리" },

        { ko: "숨 쉬고 싶은 만큼 간절하게 성공을 원할 때 성공한다.", en: "When you want to succeed as bad as you want to breathe, then you'll be successful.", author: "에릭 토머스" },
        { ko: "달을 향해 쏴라. 별들 사이에 착륙할 것이다.", en: "Shoot for the moon. Even if you miss, you'll land among the stars.", author: "레스 브라운" },

        { ko: "위대한 일은 작은 일들의 모임이다.", en: "Great things are done by a series of small things brought together.", author: "빈센트 반 고흐" },
        { ko: "성공은 매일 반복한 노력들의 합이다.", en: "Success is the sum of small efforts, repeated day in and day out.", author: "로버트 콜리어" },

        { ko: "끝날 때까지는 끝난 게 아니다.", en: "It ain't over till it's over.", author: "요기 베라" },
        { ko: "지옥을 지나고 있다면 계속 걸어가라.", en: "If you're going through hell, keep going.", author: "윈스턴 처칠" },
        { ko: "인간에게 한계란 없다.", en: "No human is limited.", author: "엘리우드 킵초게" },
        { ko: "오직 자기 절제하는 자만이 자유롭다.", en: "Only the disciplined ones in life are free.", author: "엘리우드 킵초게" },
        { ko: "차이는 세부에서 나온다.", en: "The details make the difference.", author: "빈스 롬바디" },
        { ko: "스스로를 의심하면 이미 졌다.", en: "If you doubt yourself, you've already lost.", author: "격언" },

        { ko: "최고의 보상은 배우는 것이다.", en: "Learning is the greatest reward.", author: "격언" },
        { ko: "성공은 작은 노력들이 모인 결과다.", en: "Success is accumulated small efforts.", author: "격언" },
        { ko: "끈기가 바꾸는 것이다.", en: "Persistence changes everything.", author: "격언" },
        { ko: "계속하는 것이 이기는 것이다.", en: "Keep going is winning.", author: "격언" },

        { ko: "챔피언은 승리가 아니라, 넘어졌을 때 어떻게 다시 일어서는지로 정의된다.", en: "A champion is defined not by their wins but by how they can recover when they fall.", author: "세리나 윌리엄스" },
        { ko: "인생은 누구에게도 쉽지 않다. 그래도 어떤가? 우리에게는 끈기와, 무엇보다 자신에 대한 믿음이 있어야 한다.", en: "Life is not easy for any of us. But what of that? We must have perseverance and above all confidence in ourselves.", author: "마리 퀴리" },
        { ko: "열정과 끈기는 모든 것을 이긴다.", en: "Energy and persistence conquer all things.", author: "벤저민 프랭클린" },
        { ko: "무슨 생각을 하긴요. 그냥 하는 거죠.", en: "What do I think about? I just do it.", author: "김연아" },
        { ko: "재능은 식탁 위 소금보다 흔하다. 재능 있는 사람과 성공한 사람을 가르는 것은 엄청난 노력이다.", en: "Talent is cheaper than table salt. What separates the talented individual from the successful one is a lot of hard work.", author: "스티븐 킹" },

        { ko: "너무 편안하고 안락하게 살다가, 자신의 진짜 잠재력을 깨닫지 못한 채 죽을 위험이 있다.", en: "You are in danger of living a life so comfortable and soft that you will die without ever realizing your true potential.", author: "데이비드 고긴스" },

      "피터 드러커": ["Peter Drucker", "Peter Drucker", "오스트리아 태생 미국의 경영학자. '현대 경영학의 아버지'로 불린다."],
      "워런 버핏": ["Warren Buffett", "Warren Buffett", "버크셔 해서웨이 회장. '오마하의 현인'으로 불리는 투자가."],
      "정주영": ["Chung Ju-yung", "Chung Ju-yung", "현대그룹 창업자. 건설·자동차·조선 산업을 일군 기업가."],
      "이건희": ["Lee Kun-hee", "Lee Kun-hee", "전 삼성그룹 회장. 1993년 '신경영 선언'으로 삼성의 체질을 바꿨다."],
      "리드 호프먼": ["Reid Hoffman", "Reid Hoffman", "링크드인 공동 창업자이자 벤처 투자가."],
      "빌 게이츠": ["Bill Gates", "Bill Gates", "마이크로소프트 공동 창업자이자 게이츠 재단 공동 설립자."],
      "젠슨 황": ["Jensen Huang", "Jensen Huang", "엔비디아 공동 창업자이자 CEO. 대만 출생."],
      "잭 웰치": ["Jack Welch", "Jack Welch", "제너럴 일렉트릭(GE) 전 회장. 20년간 GE를 이끈 경영자."],
      "소크라테스": ["Socrates", "Socrates", "고대 그리스 아테네의 철학자. 문답법으로 서양 철학의 기초를 놓았다."],
      "달라이 라마": ["Dalai Lama", "14th Dalai Lama", "티베트 불교의 지도자(제14대). 1989년 노벨 평화상을 받았다."],
      "빅터 프랭클": ["Viktor Frankl", "Viktor Frankl", "오스트리아의 정신의학자. 나치 수용소 경험을 담은 『죽음의 수용소에서』의 저자."],
      "마르쿠스 아우렐리우스": ["Marcus Aurelius", "Marcus Aurelius", "로마 제국의 황제이자 스토아 철학자. 『명상록』의 저자."],
      "법정 스님": ["Beopjeong", "Beopjeong", "대한민국의 승려·수필가. 『무소유』의 저자."],
      "로버트 월딩거": ["Robert Waldinger", "Robert J. Waldinger", "하버드 의대 정신의학 교수. 80년 넘게 이어진 '하버드 성인 발달 연구'의 책임자."],
      "찰리 채플린": ["Charlie Chaplin", "Charlie Chaplin", "영국 출신 희극 배우·감독. 무성영화 시대의 상징."],
      "랜디 포시": ["Randy Pausch", "Randy Pausch", "카네기멜런대 컴퓨터과학 교수. 췌장암 투병 중 남긴 '마지막 강의'로 전 세계에 감동을 줬다."],
      "공자": ["Confucius", "Confucius", "중국 춘추시대의 사상가. 유교의 창시자로, 제자들이 『논어』에 그의 말을 남겼다."],
      "사티아 나델라": ["Satya Nadella", "Satya Nadella", "마이크로소프트 CEO. 인도 출생."],
      "마하트마 간디": ["Mahatma Gandhi", "Mahatma Gandhi", "인도 독립운동 지도자. 비폭력 저항 운동을 이끌었다."],
      "브레네 브라운": ["Brené Brown", "Brené Brown", "미국 휴스턴대 연구교수. 취약성과 용기에 관한 연구로 유명하다."],
      "레오나르도 다빈치": ["Leonardo da Vinci", "Leonardo da Vinci", "이탈리아 르네상스의 화가·과학자·발명가. 『모나리자』, 『최후의 만찬』을 그렸다."],
      "정약용": ["Jeong Yak-yong", "Jeong Yak-yong", "조선 후기 실학자. 호는 다산이며 『목민심서』 등 500여 권을 남겼다."],
      "켄 로빈슨": ["Ken Robinson", "Ken Robinson (educationalist)", "영국의 교육학자. TED 강연 '학교가 창의력을 죽이는가'로 유명하다."],
      "리처드 파인만": ["Richard Feynman", "Richard Feynman", "미국의 이론물리학자. 1965년 노벨 물리학상을 받았다."],
      "찰리 멍거": ["Charlie Munger", "Charlie Munger", "버크셔 해서웨이 전 부회장. 워런 버핏의 오랜 동업자."]
    };
    function authorLabel(a) {
      if (people[a]) return `${a} (${people[a][0]})`;
      if (sourceNames[a]) return `${a} (${sourceNames[a]})`;
      return a;
    }
    function escAttr(t) { return String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
    function authorHtml(a) {
      const label = escAttr(authorLabel(a));
      return people[a]
        ? `<button type="button" class="author-link" data-person="${escAttr(a)}" title="인물 소개 보기">${label}</button>`
        : `<span class="author-plain">${label}</span>`;
    }

    const sourceNames = {"격언": "Proverb", "일본 속담": "Japanese Proverb", "한국 속담": "Korean Proverb", "중국 속담": "Chinese Proverb", "마태복음 7:7": "Matthew 7:7"};

    // ────── UI 렌더링 ──────
    let allQuotes = [];
    for (const category in quoteData) {
      allQuotes = allQuotes.concat(quoteData[category]);
    }

    function renderVideos(data) {
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = "";
      if (data.length === 0) {
        grid.innerHTML = '<div class="empty-message">검색 결과가 없습니다.</div>';
        return;
      }
      data.forEach(v => {
        const card = document.createElement("a");
        card.href = `https://www.youtube.com/watch?v=${v.id}`;
        card.target = "_blank";
        card.className = "video-card";
        card.innerHTML = `
          <div class="thumb-box">
            <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" loading="lazy" alt="${v.title}">
            <span class="play-badge">YouTube</span>
          </div>
          <div class="info-box">
            <span class="badge">${videoCategories[v.category]}</span>
            <h3>${v.title}</h3>
            <div class="speaker">${v.speaker}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderQuotes(data) {
      const grid = document.getElementById("quoteGrid");
      grid.innerHTML = "";
      if (data.length === 0) {
        grid.innerHTML = '<div class="empty-message">검색 결과가 없습니다.</div>';
        return;
      }
      data.forEach((q, i) => {
        const card = document.createElement("div");
        card.className = "quote-card";
        card.innerHTML = `
          <div class="quote-ko">${q.ko}</div>
          <div class="quote-en">${q.en}</div>
          <div class="quote-foot">
            <div class="quote-author">${authorHtml(q.author)}</div>
            <button class="copy-btn">📋 복사</button>
          </div>
        `;
        card.querySelector(".copy-btn").onclick = (e) => copyQuote(q, e.currentTarget);
        grid.appendChild(card);
      });
    }

    function copyQuote(q, btn) {
      const text = `${q.ko}\n\n${q.en}\n- ${authorLabel(q.author)}`;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "✅ 복사됨";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = "📋 복사"; btn.classList.remove("done"); }, 1500);
      });
    }

    // 필터 탭 생성 (카테고리 + 명사)
    function makeBtn(label, key, isActive) {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (isActive ? " active" : "");
      btn.textContent = label;
      btn.onclick = () => filterVideos(key, btn);
      return btn;
    }
    function createFilterTabs() {
      const tabs = document.getElementById("filterTabs");
      tabs.innerHTML = "";
      for (const [key, label] of Object.entries(videoCategories)) tabs.appendChild(makeBtn(label, key, key === "all"));
      const sTabs = document.getElementById("speakerTabs");
      sTabs.innerHTML = "";
      speakers.forEach(sp => sTabs.appendChild(makeBtn(sp, sp, false)));
    }

    // 명사 목록: 세 줄까지만 보이고 접기/펼치기
    let speakerExpanded = false;
    function layoutSpeakerTabs() {
      const box = document.getElementById("speakerTabs");
      const toggle = document.getElementById("speakerToggle");
      const btns = [...box.children];
      box.style.maxHeight = "none";
      if (!btns.length) return;
      const tops = [...new Set(btns.map(b => b.offsetTop))].sort((a, b) => a - b);
      if (tops.length <= 3) { toggle.style.display = "none"; return; }
      toggle.style.display = "";
      const firstTop = tops[0];
      const lastInRow3 = btns.filter(b => b.offsetTop === tops[2]).pop();
      const collapsedH = lastInRow3.offsetTop + lastInRow3.offsetHeight - firstTop + 2;
      box.style.maxHeight = speakerExpanded ? box.scrollHeight + "px" : collapsedH + "px";
      toggle.textContent = speakerExpanded ? "접기 ▲" : `더보기 ▼ (전체 ${btns.length}명)`;
    }
    document.getElementById("speakerToggle").onclick = () => { speakerExpanded = !speakerExpanded; layoutSpeakerTabs(); };
    window.addEventListener("resize", layoutSpeakerTabs);

    function createQuoteTabs() {
      const tabs = document.getElementById("quoteTabs");
      tabs.innerHTML = "";
      for (const [key, label] of Object.entries(quoteCategories)) {
        const btn = document.createElement("button");
        btn.className = `filter-btn ${key === 'all' ? 'active' : ''}`;
        btn.textContent = label;
        btn.onclick = () => filterQuotes(key, btn);
        tabs.appendChild(btn);
      }
    }

    let currentVideoFilter = "all";
    let currentQuoteFilter = "all";

    function filterVideos(cat, btn) {
      currentVideoFilter = cat;
      document.querySelectorAll("#filterTabs .filter-btn, #speakerTabs .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyVideoFilters();
    }

    function filterQuotes(cat, btn) {
      currentQuoteFilter = cat;
      document.querySelectorAll("#quoteTabs .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyQuoteFilters();
    }

    function applyVideoFilters() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      let filtered = rawVideos;

      if (currentVideoFilter !== "all") {
        if (videoCategories[currentVideoFilter]) {
          filtered = filtered.filter(v => v.category === currentVideoFilter);
        } else {
          filtered = filtered.filter(v => v.speaker === currentVideoFilter);
        }
      }

      if (search) {
        filtered = filtered.filter(v => v.title.toLowerCase().includes(search) || v.speaker.toLowerCase().includes(search));
      }

      document.getElementById("counterText").textContent = `${filtered.length}개 영상`;
      renderVideos(filtered);
    }

    function applyQuoteFilters() {
      const search = document.getElementById("quoteSearch").value.toLowerCase();
      let filtered = currentQuoteFilter === "all" ? allQuotes : quoteData[currentQuoteFilter];

      if (search) {
        filtered = filtered.filter(q => q.ko.toLowerCase().includes(search) || q.en.toLowerCase().includes(search) || authorLabel(q.author).toLowerCase().includes(search));
      }

      document.getElementById("quoteCounter").textContent = `${filtered.length}개 명언`;
      renderQuotes(filtered);
    }

    // 섹션 탭
    document.querySelectorAll(".section-btn").forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll(".section-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        const section = this.dataset.section;
        document.getElementById("videoSection").classList.toggle("hidden", section !== "videos");
        document.getElementById("quoteSection").classList.toggle("hidden", section !== "quotes");
        if (section === "quotes" && !document.getElementById("randomText").textContent) showRandomQuote();
      };
    });

    // 오늘의 명언
    function showRandomQuote() {
      const q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
      document.getElementById("randomText").textContent = q.ko;
      document.getElementById("randomEnText").textContent = q.en;
      document.getElementById("randomAuthor").innerHTML = "— " + authorHtml(q.author);
    }

    document.getElementById("randomBtn").onclick = showRandomQuote;

    // 검색
    document.getElementById("searchInput").oninput = applyVideoFilters;
    document.getElementById("quoteSearch").oninput = applyQuoteFilters;

    // 다운로드
    document.getElementById("downloadHtmlBtn").onclick = function() {
      const html = document.documentElement.outerHTML;
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "명연설_명언_아카이브.html";
      link.click();
    };

    // ────── 인물 팝업 ──────
    const wikiCache = {};
    async function fetchWiki(title) {
      if (wikiCache[title]) return wikiCache[title];
      const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=langlinks|pageimages&lllang=ko&pithumbsize=400&titles=" + encodeURIComponent(title);
      const j = await (await fetch(url)).json();
      const page = Object.values(j.query.pages)[0] || {};
      const info = { img: page.thumbnail ? page.thumbnail.source : null, ko: page.langlinks ? page.langlinks[0]["*"] : null, en: page.title || title };
      wikiCache[title] = info;
      return info;
    }
    function wikiUrl(lang, title) { return `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, "_"))}`; }
    function linkBtn(cls, href, text) { return `<a class="modal-btn ${cls}" href="${href}" target="_blank" rel="noopener">${text}</a>`; }

    let lastFocus = null;
    function openPerson(name) {
      const p = people[name];
      if (!p) return;
      const [en, wiki, intro] = p;
      lastFocus = document.activeElement;
      const photo = document.getElementById("personPhoto");
      photo.innerHTML = name.charAt(0);
      document.getElementById("personName").textContent = name;
      document.getElementById("personEn").textContent = en;
      document.getElementById("personIntro").textContent = intro;
      const mine = allQuotes.filter(q => q.author === name);
      document.getElementById("personQuotes").innerHTML = `<h4>이 아카이브에 실린 명언 ${mine.length}개</h4><ul>` +
        mine.map(q => `<li>${escAttr(q.ko)}<span>${escAttr(q.en)}</span></li>`).join("") + "</ul>";
      const links = document.getElementById("personLinks");
      const credit = document.getElementById("personCredit");
      if (wiki) {
        links.innerHTML = linkBtn("primary", wikiUrl("en", wiki), "📖 위키백과에서 더 보기") + linkBtn("secondary", wikiUrl("en", wiki), "🌐 English Wikipedia");
        credit.textContent = "사진 출처: Wikipedia / Wikimedia Commons";
        fetchWiki(wiki).then(info => {
          if (document.getElementById("personName").textContent !== name) return;
          if (info.img) {
            const img = new Image();
            img.alt = name;
            img.onload = () => { photo.innerHTML = ""; photo.appendChild(img); };
            img.src = info.img;
          }
          links.innerHTML = (info.ko ? linkBtn("primary", wikiUrl("ko", info.ko), "📖 한국어 위키백과에서 더 보기") : linkBtn("primary", wikiUrl("en", info.en), "📖 위키백과에서 더 보기"))
            + linkBtn("secondary", wikiUrl("en", info.en), "🌐 English Wikipedia")
            + linkBtn("secondary", "https://www.google.com/search?q=" + encodeURIComponent(en), "🔍 Google 검색");
          if (!info.img) credit.textContent = "";
        }).catch(() => {});
      } else {
        links.innerHTML = linkBtn("primary", "https://www.google.com/search?q=" + encodeURIComponent(en), "🔍 Google에서 더 보기");
        credit.textContent = "";
      }
      document.getElementById("personModal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      document.getElementById("modalClose").focus();
    }
    function closePerson() {
      document.getElementById("personModal").classList.add("hidden");
      document.body.style.overflow = "";
      if (lastFocus) lastFocus.focus();
    }
    document.addEventListener("click", e => {
      const btn = e.target.closest(".author-link");
      if (btn) { openPerson(btn.dataset.person); return; }
      if (e.target.id === "personModal") closePerson();
    });
    document.getElementById("modalClose").onclick = closePerson;
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !document.getElementById("personModal").classList.contains("hidden")) closePerson();
    });

    // 초기 렌더링
    document.getElementById("videoTotal").textContent = rawVideos.length;
    document.getElementById("videoTotalTab").textContent = rawVideos.length;
    document.getElementById("quoteTotal").textContent = allQuotes.length;
    document.getElementById("quoteTotalTab").textContent = allQuotes.length;
    createFilterTabs();
    layoutSpeakerTabs();
    createQuoteTabs();
    applyVideoFilters();
    applyQuoteFilters();
  </script>
</body>
</html>
