<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹북 · MyPage_JP</title>
<style>
  :root{
    --bg:#08080b;
    --ink:#f4f2ec;
    --ink-soft:#9c98a8;
    --line:rgba(255,255,255,0.08);
    --pub:#4dd0c8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .topbar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 24px;background:rgba(8,8,11,0.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .back-group{display:flex;align-items:center;flex-wrap:wrap;gap:14px;flex-shrink:0;}
  .back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--ink-soft);text-decoration:none;flex-shrink:0;
  }
  .back:hover{color:var(--ink);}
  .titles{text-align:center;overflow:hidden;}
  .titles .t{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .titles .s{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .pagecount{
    flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--pub);
    background:color-mix(in srgb, var(--pub) 16%, transparent);
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }

  .pages{max-width:900px;margin:0 auto;padding:32px 24px 90px;display:flex;flex-direction:column;gap:22px;}
  .sheet{
    position:relative;border-radius:10px;overflow:hidden;
    box-shadow:0 20px 40px -16px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06);
    background:#fff;
  }
  .sheet img{display:block;width:100%;height:auto;}
  .sheet .pn{
    position:absolute;right:10px;bottom:10px;
    font-size:10.5px;font-weight:700;color:#fff;
    background:rgba(0,0,0,0.55);padding:3px 9px;border-radius:999px;
  }

  .empty{
    max-width:600px;margin:80px auto;text-align:center;color:var(--ink-soft);font-size:13px;
  }

  footer{
    max-width:900px;margin:0 auto;padding:0 24px 60px;
    font-size:12px;color:#5a5766;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="back-group">
      <a class="back" id="backLink" href="publishing.html">← Publishing</a>
      <a class="back" href="https://johnpark.lovable.app/" target="_blank" rel="noopener">← Web Site로 돌아가기</a>
    </div>
    <div class="titles">
      <div class="t" id="bookTitle">웹북</div>
      <div class="s" id="bookSubtitle"></div>
    </div>
    <span class="pagecount" id="pageCount"></span>
  </div>

  <div class="pages" id="pages"></div>
  <div class="empty" id="empty" hidden>문서를 찾을 수 없습니다.</div>

  <footer>
    <span>© 2026 John Park</span>
    <span>Claude Code로 정리한 페이지 모음</span>
  </footer>

<script>
  var params = new URLSearchParams(location.search);
  var book = params.get('book');
  var pages = parseInt(params.get('pages'), 10) || 0;
  var title = params.get('title') || '웹북';
  var subtitle = params.get('subtitle') || '';
  var back = params.get('back');

  document.title = title + ' · MyPage_JP';
  document.getElementById('bookTitle').textContent = title;
  document.getElementById('bookSubtitle').textContent = subtitle;
  if (back) document.getElementById('backLink').setAttribute('href', back);

  var container = document.getElementById('pages');
  if (!book || !pages) {
    document.getElementById('empty').hidden = false;
  } else {
    document.getElementById('pageCount').textContent = pages + 'p';
    for (var i = 1; i <= pages; i++) {
      var n = i < 10 ? '0' + i : '' + i;
      var sheet = document.createElement('div');
      sheet.className = 'sheet';
      var img = document.createElement('img');
      img.src = 'assets/publishing/webbook/' + book + '/page-' + n + '.png';
      img.loading = 'lazy';
      img.alt = title + ' ' + i + '쪽';
      var pn = document.createElement('span');
      pn.className = 'pn';
      pn.textContent = i + ' / ' + pages;
      sheet.appendChild(img);
      sheet.appendChild(pn);
      container.appendChild(sheet);
    }
  }
</script>

</body>
</html>
