<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John's Painting · MyPage_JP</title>
<style>
  :root{
    --bg:#08080b;
    --bg-soft:#111015;
    --card:#151319;
    --ink:#f4f2ec;
    --ink-soft:#9c98a8;
    --line:rgba(255,255,255,0.08);
    --creative:#2fbf71;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:64px 24px 90px;}

  .back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--ink-soft);
    text-decoration:none;margin-bottom:34px;
  }
  .back:hover{color:var(--ink);}

  header.hero{margin-bottom:44px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:800;letter-spacing:.22em;
    color:var(--creative);text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{font-size:clamp(30px,5vw,42px);margin:0 0 14px;font-weight:900;letter-spacing:-0.02em;}
  .sub{font-size:14.5px;color:var(--ink-soft);line-height:1.7;max-width:600px;}
  .stats{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap;}
  .stat{font-size:13px;color:var(--ink-soft);}
  .stat b{color:var(--ink);font-size:20px;display:block;font-weight:900;}
  .note{
    margin-top:22px;font-size:12.5px;color:var(--ink-soft);
    background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;max-width:600px;line-height:1.6;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .tile{
    position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;
    background:var(--card);border:1px solid var(--line);
    aspect-ratio:1/1;
  }
  .tile img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .tile:hover img{transform:scale(1.06);}

  .lightbox{
    position:fixed;inset:0;background:rgba(4,4,6,0.92);
    display:none;align-items:center;justify-content:center;
    padding:40px 20px;z-index:100;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .lightbox .close{
    position:absolute;top:20px;right:26px;font-size:28px;color:#fff;
    background:none;border:none;cursor:pointer;line-height:1;
  }
  .lightbox .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(255,255,255,0.1);border:none;color:#fff;
    font-size:22px;width:46px;height:46px;border-radius:50%;cursor:pointer;
  }
  .lightbox .nav:hover{background:rgba(255,255,255,0.2);}
  .lightbox .prev{left:16px;}
  .lightbox .next{right:16px;}

  footer{
    margin-top:70px;padding-top:24px;border-top:1px solid var(--line);
    font-size:12px;color:#5a5766;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }

  .admin-bar{margin-bottom:24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .admin-btn{
    font-size:12.5px;font-weight:700;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;cursor:pointer;
  }
  .admin-btn:hover{border-color:var(--creative);}
  .admin-btn.active{color:var(--creative);border-color:var(--creative);}
  .admin-token-form{display:none;gap:8px;flex-wrap:wrap;align-items:center;}
  .admin-token-form.open{display:flex;}
  .admin-token-form input[type=password]{
    background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);padding:8px 12px;font-size:13px;min-width:260px;
  }
  .admin-token-form button,.admin-upload button{
    font-size:12.5px;font-weight:700;color:#08080b;background:var(--creative);
    border:none;border-radius:8px;padding:8px 14px;cursor:pointer;
  }
  .admin-token-form button:hover,.admin-upload button:hover{opacity:.9;}
  .admin-token-form button:disabled,.admin-upload button:disabled{opacity:.5;cursor:not-allowed;}
  .admin-who{font-size:12.5px;color:var(--ink-soft);display:none;}
  .admin-logout{
    font-size:12px;color:var(--ink-soft);background:none;border:none;
    text-decoration:underline;cursor:pointer;padding:0;display:none;
  }
  .admin-status{font-size:12.5px;color:var(--ink-soft);width:100%;min-height:16px;}
  .admin-status.error{color:#ff6b6b;}
  .admin-status.ok{color:var(--creative);}
  .admin-upload{display:none;gap:10px;align-items:center;flex-wrap:wrap;}
  body.admin-mode .admin-upload{display:flex;}
  .admin-upload input[type=file]{font-size:12.5px;color:var(--ink-soft);max-width:260px;}
  .tile{position:relative;}
  .tile-delete{
    position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.25);color:#fff;
    font-size:15px;line-height:1;cursor:pointer;display:none;
    align-items:center;justify-content:center;z-index:2;
  }
  body.admin-mode .tile-delete{display:flex;}
  .tile-delete:hover{background:#c0392b;border-color:#c0392b;}
  .tile.busy{opacity:.45;pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">← MyPage로 돌아가기</a>

  <header class="hero">
    <div class="eyebrow">Creative · Painting Archive</div>
    <h1>John's Painting</h1>
    <p class="sub">그동안 그려온 그림들을 모았습니다.</p>
    <div class="stats">
      <div class="stat"><b id="count">0</b>작품</div>
    </div>
    <p class="note">일부 고해상도 원본은 용량 제한으로 아직 올리지 못했습니다 — 순차적으로 추가될 예정입니다.</p>
  </header>

  <div class="admin-bar" id="adminBar">
    <button class="admin-btn" id="adminToggle" type="button">🔒 관리자 모드</button>
    <div class="admin-token-form" id="tokenForm">
      <input type="password" id="tokenInput" placeholder="GitHub Personal Access Token (repo 쓰기 권한)" autocomplete="off">
      <button type="button" id="tokenSubmit">확인</button>
    </div>
    <span class="admin-who" id="adminWho"></span>
    <button class="admin-logout" id="adminLogout" type="button">로그아웃</button>
    <div class="admin-upload" id="adminUpload">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <button type="button" id="uploadBtn">그림 추가</button>
    </div>
    <div class="admin-status" id="adminStatus"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>© 2026 John Park</span>
    <span>Claude Code로 정리한 페이지 모음</span>
  </footer>

</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="close">&times;</button>
  <button class="nav prev" id="prev">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="nav next" id="next">&#10095;</button>
</div>

<script>
  // ---- gallery data ----
  const FALLBACK_FILES = [
    "IMG_0494.jpg","IMG_0495.jpg","IMG_0979.jpg","IMG_0994.jpg","IMG_0995.jpg",
    "IMG_0998.jpg","IMG_5208.jpg","IMG_5216.jpg","IMG_5221.jpg","IMG_5223.jpg",
    "IMG_5241_2.jpg","IMG_5247_2.jpg","IMG_5262_2.jpg","IMG_5264_2.jpg","IMG_5265_2.jpg",
    "IMG_5269_2.jpg","IMG_5861_2.jpg","IMG_5862_2.jpg","IMG_5866_2.jpg","IMG_5876_2.jpg",
    "IMG_5881_2.jpg","IMG_5883_2.jpg","IMG_5884_2.jpg","IMG_6242_2.jpg"
  ];
  let files = FALLBACK_FILES.slice();

  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');

  function renderGrid(){
    grid.innerHTML = '';
    countEl.textContent = files.length;
    files.forEach((f, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.name = f;
      tile.innerHTML = `
        <img src="assets/painting/${f}" alt="John's Painting ${i+1}" loading="lazy">
        <button class="tile-delete" type="button" title="삭제">&times;</button>
      `;
      tile.querySelector('img').addEventListener('click', () => openLightbox(i));
      tile.querySelector('.tile-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        handleDelete(f, tile);
      });
      grid.appendChild(tile);
    });
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let current = 0;

  function openLightbox(i){
    current = i;
    lightboxImg.src = 'assets/painting/' + files[current];
    lightbox.classList.add('open');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
  }
  function show(delta){
    current = (current + delta + files.length) % files.length;
    lightboxImg.src = 'assets/painting/' + files[current];
  }

  document.getElementById('close').addEventListener('click', closeLightbox);
  document.getElementById('prev').addEventListener('click', () => show(-1));
  document.getElementById('next').addEventListener('click', () => show(1));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') show(-1);
    if (e.key === 'ArrowRight') show(1);
  });

  fetch(`assets/painting/manifest.json?t=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error('manifest fetch failed'); return r.json(); })
    .then(data => {
      if (Array.isArray(data.files) && data.files.length) files = data.files;
      renderGrid();
    })
    .catch(() => renderGrid());

  // ---- admin mode (GitHub token based, owner-only) ----
  const GH_OWNER = 'dec16pjh';
  const GH_REPO = 'MyPage_JP';
  const GH_BRANCH = 'main';
  const ASSET_DIR = 'assets/painting';
  const MANIFEST_PATH = `${ASSET_DIR}/manifest.json`;
  const TOKEN_KEY = 'mypage_gh_token';
  const API = 'https://api.github.com';
  const MAX_DIM = 1800;
  const MAX_BYTES = 900 * 1024;

  let ghToken = localStorage.getItem(TOKEN_KEY) || null;

  const adminToggle = document.getElementById('adminToggle');
  const tokenForm = document.getElementById('tokenForm');
  const tokenInput = document.getElementById('tokenInput');
  const tokenSubmit = document.getElementById('tokenSubmit');
  const adminWho = document.getElementById('adminWho');
  const adminLogout = document.getElementById('adminLogout');
  const adminUpload = document.getElementById('adminUpload');
  const adminStatus = document.getElementById('adminStatus');
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');

  function setStatus(msg, type){
    adminStatus.textContent = msg || '';
    adminStatus.className = 'admin-status' + (type ? ' ' + type : '');
  }

  function setAdminActive(active){
    document.body.classList.toggle('admin-mode', active);
    adminToggle.classList.toggle('active', active);
    adminToggle.textContent = active ? '🔓 관리자 모드 끄기' : '🔒 관리자 모드';
  }

  function setSignedIn(login){
    adminWho.textContent = login ? `관리자: ${login}` : '관리자 모드';
    adminWho.style.display = '';
    adminLogout.style.display = '';
    tokenForm.classList.remove('open');
    setAdminActive(true);
  }

  function signOut(){
    ghToken = null;
    localStorage.removeItem(TOKEN_KEY);
    adminWho.style.display = 'none';
    adminLogout.style.display = 'none';
    setAdminActive(false);
    setStatus('');
  }

  function ghHeaders(token){
    return {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  async function verifyToken(token){
    const res = await fetch(`${API}/repos/${GH_OWNER}/${GH_REPO}`, { headers: ghHeaders(token), cache: 'no-store' });
    if (!res.ok) throw new Error('토큰이 유효하지 않거나 저장소에 접근할 수 없습니다.');
    const data = await res.json();
    if (!data.permissions || !data.permissions.push) throw new Error('이 저장소에 대한 쓰기 권한이 없는 토큰입니다.');
    let login = '';
    try {
      const ures = await fetch(`${API}/user`, { headers: ghHeaders(token), cache: 'no-store' });
      if (ures.ok) login = (await ures.json()).login;
    } catch (e) {}
    return login;
  }

  async function getFileSha(path, token){
    // no-store: the GitHub contents API allows short browser caching of GETs,
    // which would otherwise hand back a stale sha for the next write.
    const res = await fetch(`${API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`, { headers: ghHeaders(token), cache: 'no-store' });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`파일 정보를 가져오지 못했습니다 (${path})`);
    return (await res.json()).sha;
  }

  async function putFile(path, base64Content, message, token){
    const sha = await getFileSha(path, token);
    const body = { message, content: base64Content, branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(`${API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, {
      method: 'PUT',
      cache: 'no-store',
      headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `업로드 실패 (${path})`);
    }
    return res.json();
  }

  async function deleteFile(path, message, token){
    const sha = await getFileSha(path, token);
    if (!sha) return;
    const res = await fetch(`${API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, {
      method: 'DELETE',
      cache: 'no-store',
      headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sha, branch: GH_BRANCH })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `삭제 실패 (${path})`);
    }
  }

  // Writes the given file list to manifest.json, retrying on a sha conflict
  // (another write landed between our sha read and this one).
  async function putManifest(fileList, message, token){
    const json = JSON.stringify({ files: fileList }, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(json)));
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        return await putFile(MANIFEST_PATH, base64, message, token);
      } catch (err) {
        lastErr = err;
        if (!/does not match/i.test(err.message)) throw err;
        await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
      }
    }
    throw lastErr;
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 불러올 수 없습니다.'));
        img.onload = () => {
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            if (width >= height) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
            else { width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          let quality = 0.85;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length * 0.75 > MAX_BYTES && quality > 0.4) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function makeFilename(originalName, existing){
    const base = originalName.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'painting';
    let name = `${base}.jpg`;
    let i = 1;
    while (existing.includes(name)) {
      name = `${base}-${i}.jpg`;
      i++;
    }
    return name;
  }

  async function handleUpload(){
    if (!ghToken) { setStatus('먼저 관리자 인증을 해주세요.', 'error'); return; }
    const selected = Array.from(fileInput.files || []);
    if (!selected.length) { setStatus('추가할 이미지를 선택해주세요.', 'error'); return; }

    uploadBtn.disabled = true;
    const uploaded = [];
    const failed = [];
    for (const file of selected) {
      try {
        setStatus(`업로드 중: ${file.name} (${uploaded.length + failed.length + 1}/${selected.length})...`);
        const dataUrl = await resizeImage(file);
        const base64 = dataUrl.split(',')[1];
        const filename = makeFilename(file.name, [...files, ...uploaded]);
        await putFile(`${ASSET_DIR}/${filename}`, base64, `Add painting: ${filename}`, ghToken);
        uploaded.push(filename);
      } catch (err) {
        failed.push({ name: file.name, message: err.message });
      }
    }

    // One manifest write for the whole batch, not one per file — this is
    // both faster and avoids retrying a sha-conflicting write per image.
    if (uploaded.length) {
      try {
        setStatus('목록 업데이트 중...');
        const newFiles = [...files, ...uploaded];
        await putManifest(newFiles, `Update manifest: add ${uploaded.length} painting(s)`, ghToken);
        files = newFiles;
        renderGrid();
      } catch (err) {
        setStatus(`이미지는 업로드됐지만 목록 갱신에 실패했습니다: ${err.message}`, 'error');
        uploadBtn.disabled = false;
        fileInput.value = '';
        return;
      }
    }

    if (failed.length) {
      const names = failed.map(f => f.name).join(', ');
      setStatus(`${uploaded.length}개 추가 완료, ${failed.length}개 실패 (${names})`, 'error');
    } else {
      setStatus(`${uploaded.length}개 그림을 추가했습니다.`, 'ok');
    }
    uploadBtn.disabled = false;
    fileInput.value = '';
  }

  async function handleDelete(filename, tileEl){
    if (!ghToken) { setStatus('먼저 관리자 인증을 해주세요.', 'error'); return; }
    if (!confirm(`"${filename}"을(를) 삭제할까요?`)) return;

    tileEl.classList.add('busy');
    try {
      setStatus(`삭제 중: ${filename}...`);
      await deleteFile(`${ASSET_DIR}/${filename}`, `Delete painting: ${filename}`, ghToken);
      const newFiles = files.filter(f => f !== filename);
      await putManifest(newFiles, `Update manifest: remove ${filename}`, ghToken);
      files = newFiles;
      renderGrid();
      setStatus(`삭제 완료: ${filename}`, 'ok');
    } catch (err) {
      tileEl.classList.remove('busy');
      setStatus(`삭제 실패 (${filename}): ${err.message}`, 'error');
    }
  }

  adminToggle.addEventListener('click', () => {
    if (ghToken) {
      setAdminActive(!document.body.classList.contains('admin-mode'));
      return;
    }
    tokenForm.classList.toggle('open');
  });

  tokenSubmit.addEventListener('click', async () => {
    const token = tokenInput.value.trim();
    if (!token) { setStatus('토큰을 입력해주세요.', 'error'); return; }
    tokenSubmit.disabled = true;
    setStatus('토큰 확인 중...');
    try {
      const login = await verifyToken(token);
      ghToken = token;
      localStorage.setItem(TOKEN_KEY, token);
      tokenInput.value = '';
      setSignedIn(login);
      setStatus('관리자 모드가 활성화되었습니다.', 'ok');
    } catch (err) {
      setStatus(err.message, 'error');
    }
    tokenSubmit.disabled = false;
  });

  tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenSubmit.click(); });
  adminLogout.addEventListener('click', signOut);
  uploadBtn.addEventListener('click', handleUpload);

  if (ghToken) {
    verifyToken(ghToken).then(login => setSignedIn(login)).catch(() => signOut());
  }
</script>

</body>
</html>
